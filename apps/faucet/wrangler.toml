# tXDS faucet — Cloudflare Worker config (deployed for the Enclave testnet).
# Deploy steps, secrets and incident response: docs/runbooks/faucet.md
#
# Secrets (never put these in this file; set with `wrangler secret put <NAME>`):
#   FAUCET_PRIVATE_KEY    0x + 64 hex. HOT wallet only, holding a small float (see runbook).
#   TURNSTILE_SECRET_KEY  Turnstile widget secret key.
# Local dev: copy .dev.vars.example to .dev.vars (gitignored).

name = "xdevs-faucet"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
# JSON API only. The UI (apps/faucet-web) is a Cloudflare Pages project on faucet.xdevschain.tech;
# this route sends faucet.xdevschain.tech/api/* to the Worker (Worker routes take precedence over Pages).
routes = [{ pattern = "faucet.xdevschain.tech/api/*", zone_name = "xdevschain.tech" }]

[vars]
RPC_URL = "https://rpc.xdevschain.tech"                # Enclave public RPC full node (plan §24.2)
CHAIN_ID = "717171"                                    # xDEVS Chain Enclave (0xAF173)
DRIP_AMOUNT = "100"                                    # tXDS per claim (plan §20.3)
MIN_FAUCET_BALANCE = "1000"                            # pause drips below this many tXDS
# Cross-origin callers of /api/*. The faucet UI is same-origin and needs no entry; the status page polls /api/status.
CORS_ORIGINS = "https://status.xdevschain.tech,https://explorer.xdevschain.tech,https://wallet.xdevschain.tech"
EXPLORER_TX_URL = "https://explorer.xdevschain.tech/tx/{hash}"
TURNSTILE_EXPECTED_HOSTNAME = "faucet.xdevschain.tech" # empty = not checked (use empty with the Turnstile test keys)
# The Turnstile SITE key now lives in the UI build: NEXT_PUBLIC_TURNSTILE_SITE_KEY in apps/faucet-web.

# Rate-limit markers (addr:<address>, ip:<ipv4>, ip6:<prefix>/64), 24 h TTL.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "e9dea4b4200a4f64b0ee7e80df702097"                # xdevs-faucet-RATE_LIMIT

# Single Durable Object that serializes signing so nonces never collide.
[[durable_objects.bindings]]
name = "FAUCET_SIGNER"
class_name = "FaucetSigner"

# SQLite-backed DO class (the only kind available on the Workers Free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FaucetSigner"]

[observability]
enabled = true
