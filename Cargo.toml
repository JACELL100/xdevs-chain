[workspace]
resolver = "2"
members = ["crates/*", "bin/*", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.91"
authors = ["THE xDEVS"]
repository = "https://github.com/xdevs-chain/xdevs-chain"

[workspace.dependencies]
# --- Internal crates -------------------------------------------------------
xdevs-primitives = { path = "crates/primitives" }
xdevs-crypto = { path = "crates/crypto" }
xdevs-storage = { path = "crates/storage" }
xdevs-state = { path = "crates/state" }
xdevs-execution = { path = "crates/execution" }
xdevs-genesis = { path = "crates/genesis" }
xdevs-mempool = { path = "crates/mempool" }
xdevs-rpc = { path = "crates/rpc" }
xdevs-node = { path = "crates/node" }
xdevs-consensus = { path = "crates/consensus" }
xdevs-network = { path = "crates/network" }
xdevs-metrics = { path = "crates/metrics" }
xdevs-testutils = { path = "crates/testutils" }

# --- Ethereum types & EVM --------------------------------------------------
# alloy-* 2.5.x all depend on alloy-primitives 1.x and alloy-trie 0.9.x;
# revm 43.0.x depends on alloy-primitives ^1.5.2, so a single alloy-primitives
# copy is shared across the whole graph.
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std", "serde", "rlp", "k256", "map-foldhash"] }
alloy-rlp = { version = "0.3.17", features = ["derive"] }
alloy-consensus = { version = "2.5.0", default-features = false, features = ["std", "serde", "k256"] }
alloy-eips = { version = "2.5.0", default-features = false, features = ["std", "serde", "k256"] }
alloy-trie = { version = "0.9.9", default-features = false, features = ["std", "serde", "ethereum"] }
alloy-rpc-types-eth = { version = "2.5.0", default-features = false, features = ["std", "serde", "k256"] }
alloy-serde = { version = "2.5.0", default-features = false, features = ["std"] }
alloy-signer = { version = "2.5.0" }
alloy-signer-local = { version = "2.5.0" }
alloy-network = { version = "2.5.0", default-features = false, features = ["k256"] }
# revm without its C backends (c-kzg, blst, secp256k1-sys): ecrecover uses
# k256, BLS12-381 uses arkworks, KZG point-evaluation is unavailable (blobs
# are a non-goal). The `optional_*` features let eth_call / estimateGas relax
# balance / base-fee / gas-limit checks via CfgEnv flags.
revm = { version = "43.0.3", default-features = false, features = [
    "std",
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_no_base_fee",
] }

# --- Async & RPC -----------------------------------------------------------
tokio = { version = "1.54.1", features = ["full"] }
jsonrpsee = { version = "0.26.1", features = ["server", "macros"] }
async-trait = "0.1.92"

# --- Storage ---------------------------------------------------------------
redb = "4.5.0"

# --- Crypto ----------------------------------------------------------------
# k256 / p256 are pinned to 0.13 (latest is 0.14) because alloy and revm still
# depend on 0.13; using the same major lets key types flow between crates and
# avoids compiling two elliptic-curve stacks.
k256 = { version = "0.13.4", features = ["ecdsa"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
# ed25519-dalek 2.x (latest 3.0) matches what libp2p (Phase 2) uses.
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
# Web3 Secret Storage v3 keystores (pure Rust, RustCrypto digest-0.10 / cipher-0.4
# family so hmac / sha2 are shared with the rest of the graph).
scrypt = { version = "0.12.0", default-features = false }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
hmac = "0.12.1"
sha2 = "0.10.9"
aes = "0.8.4"
ctr = "0.9.2"
zeroize = "1.9.1"
subtle = "2.6.1"
# rand 0.8 is what alloy-signer-local / k256 0.13 use (rand_core 0.6).
rand = "0.8.8"

# --- Consensus (xdevs-consensus only) --------------------------------------
# Pin exactly: Malachite breaks its API on every minor release
# (docs/research/phase2-consensus.md §10). Malachite types never leave
# crates/consensus.
arc-malachitebft-app-channel = "=0.8.2"   # re-exports app, engine, core types, config, codec, sync, wal
arc-malachitebft-signing-ed25519 = { version = "=0.8.2", features = ["std", "rand", "serde", "zeroize"] }
ed25519-consensus = "2.1.0"                # same as Malachite's signing scheme (ZIP-215)

# --- Networking (xdevs-network; must equal Malachite's libp2p) --------------
libp2p = { version = "=0.56.0", default-features = false, features = [
    "tokio", "tcp", "quic", "dns", "noise", "yamux", "gossipsub", "identify",
    "kad", "ping", "request-response", "macros", "ed25519", "metrics",
] }

# --- Metrics (xdevs-metrics; Malachite's registry type) ---------------------
prometheus-client = "0.23.1"

# --- Utilities -------------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
clap = { version = "4.6.7", features = ["derive"] }
parking_lot = "0.13.0"
# Hidden password prompt for xdevs-cli.
rpassword = "7.4.0"

# --- Testing ---------------------------------------------------------------
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.dev]
# Keep debug info small: the shared target dir lives on a nearly-full disk.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies: no debug info, light optimisation (revm is very slow at -O0).
debug = false
opt-level = 1

[profile.test]
# `test` already inherits from `dev`; restated here for clarity.
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
opt-level = 1
