[package]
name = "xdevs-loadgen"
description = "xDEVS Chain load generator: N senders, target TPS, latency percentiles."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xdevs-loadgen"
path = "src/main.rs"

[dependencies]
xdevs-primitives.workspace = true
xdevs-crypto.workspace = true
xdevs-genesis.workspace = true
anyhow.workspace = true
clap.workspace = true
jsonrpsee = { workspace = true, features = ["http-client"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
# Integration test: an in-process dev node (same harness as tests/e2e).
xdevs-node.workspace = true
tempfile.workspace = true
