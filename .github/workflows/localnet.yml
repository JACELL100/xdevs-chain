name: localnet

# Multi-node end-to-end test on the Docker localnet (research doc §6.12, WP5): build the
# node image, start 4 validators, then inject faults (scripts/chaos.sh) and assert with
# scripts/check.sh after every step: no fork, same state roots, progress or halt as
# expected, a late full node catches up.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "apps/**", "sdk/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "apps/**", "sdk/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localnet-e2e:
    name: localnet-e2e (4 validators + joiner, chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      XDEVS_IMAGE: xdevs:local
      XDEVS_BLOCK_TIME: 1s
      XDEVS_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Same cache scope as the amd64 leg of docker.yml, so either job warms the other.
      - name: Build the node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/local/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.XDEVS_IMAGE }}
          load: true
          cache-from: type=gha,scope=xdevs-linux-amd64
          cache-to: type=gha,mode=max,scope=xdevs-linux-amd64

      - name: Tool versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
          docker run --rm --entrypoint xdevs-cli "$XDEVS_IMAGE" --version

      - name: Scenarios (core, extended, joiner)
        run: bash scripts/localnet-e2e.sh core extended joiner

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localnet-e2e-logs
          path: e2e-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: bash scripts/localnet-down.sh || true
