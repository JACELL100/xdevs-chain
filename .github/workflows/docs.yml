name: docs

# Builds the VitePress docs site and landing page (apps/docs) on every PR and push to main
# that touches it (`vitepress build` fails on dead internal links, so this is also the link
# check), and deploys main to Cloudflare Pages: project `xdevs-chain-docs`, served at
# https://xdevschain.xdevs.in.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Pages: Edit) and the repository
# variable CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
          retention-days: 7

  deploy:
    # Only main is published; PRs just build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
      url: https://xdevschain.xdevs.in
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=xdevs-chain-docs --branch=main --commit-dirty=true
