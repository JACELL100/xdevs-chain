name: docs

# Builds the VitePress docs site and landing page (apps/docs) on every PR and push to main
# that touches it. `vitepress build` fails on dead internal links, so this is also the link
# check.
#
# Deploying to GitHub Pages is optional and manual only (Actions -> docs -> Run workflow,
# tick "deploy"). The recommended host is Cloudflare Pages (see apps/docs/README.md),
# because the xdevs.in zone already lives on Cloudflare. Before the first Pages deploy:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. DNS first: create `CNAME xdevschain -> jacell100.github.io` in Cloudflare (DNS only),
#      otherwise the custom domain xdevschain.xdevs.in cannot be verified or get HTTPS.
#   3. Settings -> Pages -> Custom domain: xdevschain.xdevs.in (Actions-based deploys ignore
#      a CNAME file, so the site does not ship one).

on:
  push:
    branches: [main]
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the built site to GitHub Pages (needs the DNS setup above)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    # Manual only: never deploys from PRs or pushes.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
