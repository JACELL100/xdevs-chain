name: ml-contract-risk

# Trains the xDEVS Contract Risk model (ml/contract-risk) on public data and, with publish=true,
# uploads it to Hugging Face (needs the HF_TOKEN secret). Manual only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: probe | train | space (re-publish only the demo Space)
        default: train
      publish:
        description: upload the model and demo Space to Hugging Face
        default: "false"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ml/contract-risk
    steps:
      - name: Free runner disk for the 10 GB dataset
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/contract-risk/requirements.txt
      - run: pip install -r requirements.txt
      - name: Probe datasets
        if: inputs.mode == 'probe'
        run: python probe.py
      - name: Train and evaluate
        if: inputs.mode == 'train'
        run: python train.py --out out
      - name: Publish to Hugging Face
        if: inputs.mode == 'train' && inputs.publish == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python publish.py --model-dir out
      - name: Publish the demo Space only
        if: inputs.mode == 'space'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python publish.py --space-only
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'train'
        with:
          name: contract-risk-model
          path: ml/contract-risk/out
          retention-days: 30
