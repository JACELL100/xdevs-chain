name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Compiler-level cache (sccache on the GitHub Actions cache) on top of Swatinem/rust-cache:
  # crates that did not change are reused even when Cargo.lock changes a little.
  # Incremental compilation is off because sccache cannot cache incremental builds.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Which parts of the repo a push touches. Rust jobs are skipped when only docs, TypeScript
  # apps or the website change (those PRs then finish in minutes); main always runs everything
  # that changed, and the ARM and Windows builds run only on main.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "bin/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
              - "contracts/**"
              - "deploy/configs/**"
              - ".github/workflows/ci.yml"
            contracts:
              - "contracts/**"
              - ".github/workflows/ci.yml"

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # PRs: x86_64 only. main: x86_64 + ARM64.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    # TODO: pin action versions to commit SHAs once the repo is set up.
    steps:
      - uses: actions/checkout@v5
      # The repo's rust-toolchain.toml pins the version; rustup honours it.
      # .cargo/config.toml contains a local-only proxy/target-dir setup, so CI
      # removes it before building.
      - name: Drop local-only cargo config
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Use sccache
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Phase 5: sequential vs Block-STM on generated blocks (outcomes are asserted equal);
      # results quoted in docs/research/parallel-execution.md.
      - name: Block-STM benchmark
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release --locked -p xdevs-execution --example parallel_bench -- 2000

  # The maintainers develop on Windows with the GNU toolchain: keep the whole workspace
  # (Malachite, libp2p, redb, ...) compiling for x86_64-pc-windows-gnu.
  windows-check:
    name: windows-check (x86_64-pc-windows-gnu)
    needs: changes
    # main only: PRs are checked on Linux; Windows-specific breakage is caught when they land.
    if: github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # .cargo/config.toml is local-only and gitignored; make sure no copy is used.
      - name: Drop local-only cargo config
        run: rm -f .cargo/config.toml
      # MinGW-w64 gcc for crates with C code (ring, ...).
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW gcc on PATH
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: printf '%s\n' "${MSYS2_ROOT}\\mingw64\\bin" >> "$GITHUB_PATH"
      - name: Install the GNU toolchain
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          # Overrides rust-toolchain.toml's "stable" (which would resolve to the MSVC host).
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          gcc --version | head -n1
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Use sccache
        run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: cargo check --workspace --locked

  audit:
    needs: changes
    # New advisories appear without any code change, so main always runs it.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Accepted advisories (each with a reason and a re-check date) live in
      # .cargo/audit.toml, which cargo-audit reads automatically. Unmaintained-crate
      # notices are warnings; any other advisory fails the job.
      - run: cargo audit

  contracts:
    name: contracts (foundry)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test

  # Phase 7 light-client bridges: both directions end to end on two anvils with the real contracts and relayer
  # (dev consensus keys; the real-data checks are the Foundry fixtures tests).
  bridge-e2e:
    name: bridge e2e (anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/bridge-relayer/package-lock.json
            package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build:sdk
      - run: npm ci --no-audit --no-fund
        working-directory: tools/bridge-relayer
      - run: forge build
        working-directory: contracts
      - run: npm run e2e
        working-directory: tools/bridge-relayer

  js:
    name: js (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [apps/faucet, apps/indexer, tools/bridge-relayer, apps/bundler]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ${{ matrix.package }}/package-lock.json
            package-lock.json
      # The indexer depends on the local SDK ("file:../../sdk/ts"); its dist/ is not committed. The SDK is a
      # member of the root npm workspace, so install the workspace and build it first.
      - name: Build @xdevs/sdk
        if: matrix.package == 'apps/indexer' || matrix.package == 'tools/bridge-relayer'
        working-directory: .
        run: npm ci --no-audit --no-fund && npm run build:sdk
      # The bundler's integration / end-to-end tests run against anvil (--hardfork osaka + the dev genesis alloc).
      - uses: foundry-rs/foundry-toolchain@v1
        if: matrix.package == 'apps/bundler'
        with:
          version: v1.9.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          XDEVS_TEST_CHAIN: anvil

  # The npm workspace at the repo root: @xdevs/sdk, @xdevs/ui and the Next.js apps
  # (explorer, wallet, faucet-web, status). One install, then typecheck + test + static build per package.
  web:
    name: web (sdk, ui, apps)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # web job anvil: the wallet's passkey/e2e tests run against a local anvil chain.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: npm ci --no-audit --no-fund
      - id: sdk
        name: "@xdevs/sdk: build, typecheck, test"
        run: |
          npm run build:sdk
          npm run typecheck -w @xdevs/sdk
          npm test -w @xdevs/sdk
      - name: "@xdevs/ui: typecheck, test"
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: |
          npm run typecheck -w @xdevs/ui
          npm test -w @xdevs/ui
      - name: "apps/explorer: typecheck, test, build"
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: npm run typecheck && npm test && npm run build
        working-directory: apps/explorer
      - name: "apps/wallet: typecheck, test, build"
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: npm run typecheck && npm test && npm run build
        working-directory: apps/wallet
      - name: "apps/faucet-web: typecheck, test, build"
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: npm run typecheck && npm test && npm run build
        working-directory: apps/faucet-web
      - name: "apps/status: typecheck, test, build"
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: npm run typecheck && npm test && npm run build
        working-directory: apps/status
