name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm] # x86_64 + ARM64
    runs-on: ${{ matrix.os }}
    # TODO: pin action versions to commit SHAs once the repo is set up.
    steps:
      - uses: actions/checkout@v5
      # The repo's rust-toolchain.toml pins the version; rustup honours it.
      # .cargo/config.toml contains a local-only proxy/target-dir setup, so CI
      # removes it before building.
      - name: Drop local-only cargo config
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The maintainers develop on Windows with the GNU toolchain: keep the whole workspace
  # (Malachite, libp2p, redb, ...) compiling for x86_64-pc-windows-gnu.
  windows-check:
    name: windows-check (x86_64-pc-windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # .cargo/config.toml is local-only and gitignored; make sure no copy is used.
      - name: Drop local-only cargo config
        run: rm -f .cargo/config.toml
      # MinGW-w64 gcc for crates with C code (ring, ...).
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW gcc on PATH
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: printf '%s\n' "${MSYS2_ROOT}\\mingw64\\bin" >> "$GITHUB_PATH"
      - name: Install the GNU toolchain
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          # Overrides rust-toolchain.toml's "stable" (which would resolve to the MSVC host).
          echo "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          gcc --version | head -n1
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - run: cargo check --workspace --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Accepted advisories (each with a reason and a re-check date) live in
      # .cargo/audit.toml, which cargo-audit reads automatically. Unmaintained-crate
      # notices are warnings; any other advisory fails the job.
      - run: cargo audit

  contracts:
    name: contracts (foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test

  js:
    name: js (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [sdk/ts, apps/faucet]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
