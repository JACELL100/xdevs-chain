# Ansible settings for the xDEVS Chain testnet (run from deploy/ansible/).
[defaults]
inventory = inventory/testnet/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
# Never print secrets: tasks that touch vault data also set no_log / diff: false.
display_args_to_stdout = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
