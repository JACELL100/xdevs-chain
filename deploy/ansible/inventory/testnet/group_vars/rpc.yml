---
# Public RPC full node (home machine behind Cloudflare Tunnel, plan §24.2, §19.3).
xdevs_role: rpc
xdevs_pruning: full
# Public namespaces only: never debug_, txpool_ or admin_ (plan §19.3).
xdevs_rpc_namespaces: ["eth", "net", "web3", "xdevs"]
# Separate WS listener so Cloudflare can route ws.xdevschain.tech to it.
xdevs_rpc_ws_enabled: true
# Every request arrives from cloudflared on 127.0.0.1, so the node's per-IP limiter would
# throttle all users together: keep it off and rate-limit at Cloudflare instead
# (deploy/cloudflare/waf-and-rate-limits.md). The global caps below still apply.
xdevs_rpc_rate_limit_per_ip: 0
xdevs_rpc_max_concurrent_requests: 0
xdevs_rpc_evm_timeout_ms: 5000
xdevs_rpc_cors: ["*"]
