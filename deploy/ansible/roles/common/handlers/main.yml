---
- name: Validate and reload sshd
  ansible.builtin.command: sshd -t
  changed_when: true
  notify: Reload sshd

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Reload netfilter-persistent
  ansible.builtin.command: netfilter-persistent reload
  changed_when: true

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
