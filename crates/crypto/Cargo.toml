[package]
name = "xdevs-crypto"
description = "xDEVS Chain cryptography: secp256k1 tx signing/recovery, P-256, Ed25519, keccak, keystores."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
xdevs-primitives.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
k256.workspace = true
p256.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
scrypt.workspace = true
pbkdf2.workspace = true
hmac.workspace = true
sha2.workspace = true
aes.workspace = true
ctr.workspace = true
zeroize.workspace = true
subtle.workspace = true
rand.workspace = true
# Base58 for libp2p peer ids (already in the graph via libp2p-identity).
bs58 = "0.5.1"

[dev-dependencies]
# Cross-checks the hand-built peer id against libp2p (same version as libp2p 0.56).
libp2p-identity = { version = "=0.2.14", features = ["ed25519", "peerid"] }
proptest.workspace = true
tempfile.workspace = true
