[package]
name = "xdevs-testutils"
description = "xDEVS Chain test utilities: in-process multi-node LocalNet harness and assertions (dev-only)."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
xdevs-node.workspace = true
xdevs-consensus.workspace = true
xdevs-crypto.workspace = true
xdevs-genesis.workspace = true
xdevs-primitives.workspace = true
anyhow.workspace = true
jsonrpsee = { workspace = true, features = ["http-client"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
